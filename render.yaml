# =============================================================================
# PsiGestor — Render Blueprint (Etapa A: Demostración Académica Gratuita)
# =============================================================================
# GOVERNANCE, PLAN COMPATIBILITY & MIGRATION SAFETY:
# 1. 100% Free Plan ($0/month): All services use `plan: free` with no credit
#    card required.
# 2. Render Free Tier Rule: Render strictly permits ONLY ONE `plan: free`
#    PostgreSQL database per account/workspace (expires in 30 days).
#    Therefore, this Blueprint provisions exclusively the Staging environment
#    (`psigestor-db-staging`, `psigestor-api-staging`, `psigestor-web-staging`).
# 3. For professional persistent infrastructure with independent production and
#    staging databases (Etapa B), use `render.production.yaml`.
# 4. `buildCommand` NEVER connects to or modifies any database.
# 5. Migrations are executed via the controlled manual procedure
#    (`--verify-only` followed by `--migrate-only` or `--seed-academic-demo`)
#    documented in `docs/RENDER_DEPLOYMENT_GUIDE.md`.
# =============================================================================

databases:
  - name: psigestor-db-staging
    databaseName: psigestor_staging
    user: psigestor_staging_user
    plan: free

services:
  # ===========================================================================
  # STAGING ENVIRONMENT (Branch: develop — Free Academic Demo)
  # ===========================================================================
  - type: web
    name: psigestor-api-staging
    runtime: python
    plan: free
    branch: develop
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: SKIP_DB_INIT_ON_IMPORT=true gunicorn --chdir backend app.app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: staging
      - key: FLASK_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: psigestor-db-staging
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MOBILE_TOKEN_SECRET
        generateValue: true
      - key: STRICT_AUTH
        value: "true"
      - key: ENFORCE_CSRF_TOKEN
        value: "true"
      - key: RATE_LIMIT_STORAGE
        value: database
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ALLOW_CAPACITOR_ORIGINS
        value: "true"
      - key: ALLOW_STAGING_SEEDS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: INITIAL_PSYCHOLOGIST_EMAIL
        sync: false
      - key: INITIAL_PSYCHOLOGIST_PASSWORD
        sync: false
      - key: DEMO_STUDENT_PASSWORD
        sync: false

  - type: web
    name: psigestor-web-staging
    runtime: node
    plan: free
    rootDir: frontend
    branch: develop
    autoDeploy: true
    healthCheckPath: /login
    buildCommand: npm ci && npx ng build --configuration staging
    startCommand: node dist/PsiGestor/server/server.mjs
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://psigestor-api-staging.onrender.com
      - key: ALLOWED_HOSTS
        value: psigestor-web-staging.onrender.com,*.onrender.com,localhost,127.0.0.1
