<header class="p02-dark-header" [class.p04-compact-header]="calendarViewMode === 'mes'">
  <div class="p02-header-inner">
    <!-- Fila Superior: Perfil de la Psicóloga y Campana (en Día y Semana) -->
    @if (calendarViewMode !== 'mes') {
      <div class="p02-profile-row">
        <div class="p02-profile-left">
          <div class="p02-avatar-ring">
            <svg class="p02-doctor-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="7.5" r="3.5" fill="#0284C7"/>
              <path d="M5.5 19.5C5.5 15.9101 8.41015 13 12 13C15.5899 13 18.5 15.9101 18.5 19.5" stroke="#0284C7" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M9.5 14.5V17.5M14.5 14.5V17.5" stroke="#0369A1" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="14.5" cy="18" r="1.2" fill="#0369A1"/>
            </svg>
          </div>
          <div class="p02-profile-texts">
            <h2 class="p02-psych-name">{{ psychologistName }}</h2>
            <p class="p02-psych-role">{{ psychologistRole }}</p>
          </div>
        </div>

        <button
          type="button"
          class="p02-notif-btn"
          (click)="onNotificationClick()"
          aria-label="Notificaciones"
        >
          <ion-icon name="notifications-outline"></ion-icon>
          @if (hasNotifications) {
            <span class="p02-notif-dot"></span>
          }
        </button>
      </div>
    }

    <!-- Fila Inferior: Mi Agenda + Selector Día | Semana | Mes -->
    <div class="p02-title-switch-row" [class.no-top-margin]="calendarViewMode === 'mes'">
      <div class="p02-brand-wrap">
        <div class="p02-brand-title">
          <svg class="p02-cal-check-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="4" width="18" height="17" rx="3" stroke="#38BDF8" stroke-width="2"/>
            <path d="M8 2.5V5.5M16 2.5V5.5M3 9H21" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 14.5L11 16.5L15.5 12" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1>Mi Agenda</h1>
        </div>
        @if (calendarViewMode === 'mes') {
          <p class="p04-header-sub">{{ monthYearLabel }} · Calendario Clínico</p>
        }
      </div>

      <div class="p02-view-segmented" role="tablist" aria-label="Vista de calendario">
        <button
          type="button"
          class="p02-seg-btn"
          [class.active]="calendarViewMode === 'dia'"
          (click)="onSelectViewMode('dia')"
        >
          Día
        </button>
        <button
          type="button"
          class="p02-seg-btn"
          [class.active]="calendarViewMode === 'semana'"
          (click)="onSelectViewMode('semana')"
        >
          Semana
        </button>
        <button
          type="button"
          class="p02-seg-btn"
          [class.active]="calendarViewMode === 'mes'"
          (click)="onSelectViewMode('mes')"
        >
          Mes
        </button>
      </div>
    </div>
  </div>
</header>
