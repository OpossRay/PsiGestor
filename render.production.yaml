# =============================================================================
# PsiGestor — Render Blueprint (Etapa B: Infraestructura Profesional Completa)
# =============================================================================
# INFRAESTRUCTURA DE PRODUCCIÓN Y STAGING DEDICADA:
# - Bases de datos PostgreSQL independientes y persistentes (sin expiración de 30 días).
# - Respaldo diario automatizado en producción.
# - Servicios web en `plan: starter` (activos 24/7 sin suspensión por inactividad).
# - Separación estricta de dominios, secretos y credenciales.
#
# ESTIMACIÓN DE COSTOS (Precios oficiales de Render):
# - 2× PostgreSQL (staging + prod en `basic-256mb`): $12.00 USD/mes ($6 c/u)
# - 4× Web Services (2 staging + 2 prod en `starter`): $28.00 USD/mes ($7 c/u)
# - Costo total estimado: $40.00 USD/mes
# =============================================================================

databases:
  # Base de datos aislada para Staging
  - name: psigestor-db-staging
    databaseName: psigestor_staging
    user: psigestor_staging_user
    plan: basic-256mb

  # Base de datos aislada para Producción (con respaldos diarios)
  - name: psigestor-db-prod
    databaseName: psigestor_prod
    user: psigestor_prod_user
    plan: basic-256mb

services:
  # ===========================================================================
  # 1. AMBIENTE STAGING (Rama: develop — Integración Continua)
  # ===========================================================================
  - type: web
    name: psigestor-api-staging
    runtime: python
    plan: starter
    branch: develop
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install --no-cache-dir -r requirements.txt
    preDeployCommand: PYTHONPATH=backend python -m app.init_db --migrate-only
    startCommand: SKIP_DB_INIT_ON_IMPORT=true gunicorn --chdir backend app.app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: staging
      - key: FLASK_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: psigestor-db-staging
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MOBILE_TOKEN_SECRET
        generateValue: true
      - key: STRICT_AUTH
        value: "true"
      - key: ENFORCE_CSRF_TOKEN
        value: "true"
      - key: RATE_LIMIT_STORAGE
        value: database
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ALLOW_CAPACITOR_ORIGINS
        value: "true"
      - key: ALLOW_STAGING_SEEDS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: INITIAL_PSYCHOLOGIST_EMAIL
        sync: false
      - key: INITIAL_PSYCHOLOGIST_PASSWORD
        sync: false

  - type: web
    name: psigestor-web-staging
    runtime: node
    plan: starter
    rootDir: frontend
    branch: develop
    autoDeploy: true
    healthCheckPath: /login
    buildCommand: npm ci && npx ng build --configuration staging
    startCommand: node dist/PsiGestor/server/server.mjs
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://psigestor-api-staging.onrender.com
      - key: ALLOWED_HOSTS
        value: psigestor-web-staging.onrender.com,*.onrender.com,localhost,127.0.0.1

  # ===========================================================================
  # 2. AMBIENTE PRODUCCIÓN (Rama: main — Puerta de Aprobación Manual)
  # ===========================================================================
  - type: web
    name: psigestor-api
    runtime: python
    plan: starter
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: SKIP_DB_INIT_ON_IMPORT=true gunicorn --chdir backend app.app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: psigestor-db-prod
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MOBILE_TOKEN_SECRET
        generateValue: true
      - key: STRICT_AUTH
        value: "true"
      - key: ENFORCE_CSRF_TOKEN
        value: "true"
      - key: RATE_LIMIT_STORAGE
        value: database
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ALLOW_CAPACITOR_ORIGINS
        value: "true"
      - key: ALLOW_STAGING_SEEDS
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: INITIAL_PSYCHOLOGIST_EMAIL
        sync: false
      - key: INITIAL_PSYCHOLOGIST_PASSWORD
        sync: false

  - type: web
    name: psigestor-web
    runtime: node
    plan: starter
    rootDir: frontend
    branch: main
    autoDeploy: false
    healthCheckPath: /login
    buildCommand: npm ci && npx ng build --configuration production
    startCommand: node dist/PsiGestor/server/server.mjs
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://psigestor-api.onrender.com
      - key: ALLOWED_HOSTS
        value: psigestor-web.onrender.com,*.onrender.com,localhost,127.0.0.1
